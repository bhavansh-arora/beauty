name: Build site

# GitHub Pages serves the repo root of `main` ("Deploy from a branch").
# Edit the site in source/; this workflow rebuilds it and commits the output
# (index.html, 404.html, assets/) to the root so Pages publishes it.

on:
  push:
    branches: [main]
    paths: ["source/**"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-site
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: source/package-lock.json
      - run: npm ci
        working-directory: source
      - run: npm run build
        working-directory: source
        env:
          VITE_BACKEND_URL: ${{ vars.VITE_BACKEND_URL }}
          VITE_WHATSAPP_NUMBER: ${{ vars.VITE_WHATSAPP_NUMBER }}
      # 404.html is a copy of the app so /services, /gallery and /contact load directly.
      - name: Copy build to repo root
        run: |
          rm -rf assets
          cp -r source/dist/assets assets
          cp source/dist/index.html index.html
          cp source/dist/index.html 404.html
          touch .nojekyll
      - name: Commit build
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git add -A index.html 404.html assets .nojekyll
          git diff --cached --quiet && exit 0
          git commit -m "Rebuild site"
          git push
